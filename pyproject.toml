[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegtrace"
version = "0.1.0"
description = "MRP in DuckDB SQL: low-level-code netting and pegging of shortages up the bill of materials to customer orders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pegtrace contributors" }]
keywords = ["mrp", "bill-of-materials", "duckdb", "supply-chain", "sql"]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pyyaml>=6",
]

[project.scripts]
pegtrace = "pegtrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pegtrace"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "pegtrace/sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pegtrace"]
known-local-folder = ["conftest", "reference_mrp"]
